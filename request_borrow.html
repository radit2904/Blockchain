<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajukan Peminjaman - dApp Aset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 50px;
        }

        .form-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            margin-top: 40px;
            border-top: 5px solid #0d6efd;
        }

        .page-title {
            color: #0d6efd;
            font-weight: 800;
        }

        .btn-submit {
            background: linear-gradient(135deg, #0d6efd, #00d2ff);
            border: none;
            color: white;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.6);
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            
            <div class="form-card">
                <a href="dashboard.html" class="btn btn-outline-secondary mb-4 rounded-pill">
                    &larr; Kembali ke Dashboard
                </a>

                <div class="text-center mb-4">
                    <h2 class="page-title">📝 Form Pengajuan Peminjaman</h2>
                </div>

                <form id="borrowForm">
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="borrowerName" placeholder="Nama/Organisasi" required>
                                <label for="borrowerName">Nama Peminjam / Organisasi</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="assetId" placeholder="ID Aset" required>
                                <label for="assetId">Kode / ID Aset yang Dipinjam</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4 bg-light p-3 rounded border">
                        <label class="fw-bold text-secondary mb-2">📸 Foto / Scan KTM Peminjam</label>
                        <input class="form-control" type="file" id="ktmPhoto" accept="image/*">
                        <small class="text-muted">Opsional untuk saat ini (akan disimpan di IPFS).</small>
                    </div>

                    <div class="form-floating mb-4">
                        <textarea class="form-control" id="borrowPurpose" placeholder="Tujuan Peminjaman" style="height: 100px" required></textarea>
                        <label for="borrowPurpose">Tujuan Peminjaman (Contoh: Rapat BEM, Acara Kampus)</label>
                    </div>

                    <hr class="my-4">

                    <button type="button" class="btn btn-submit w-100 fs-5" id="btnSubmit" onclick="submitBorrowRequest()">
                         Ajukan Peminjaman
                    </button>

                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<!-- Wajib panggil app.js biar nyambung sama alamat contract utama -->
<script src="app.js"></script>

<script>
    // Autofill nama dari data login sebelumnya
    document.addEventListener("DOMContentLoaded", () => {
        const savedName = localStorage.getItem("sessionName");
        if (savedName) {
            document.getElementById("borrowerName").value = savedName;
        }
    });

    // === FUNGSI PINJAM ===
    async function submitBorrowRequest() {
        const borrowerName = document.getElementById("borrowerName").value;
        const assetId = document.getElementById("assetId").value;
        const btn = document.getElementById("btnSubmit");

        if (!borrowerName || !assetId) {
            alert("Harap isi Nama Peminjam dan Kode/ID Aset!");
            return;
        }

        // Panggil fungsi koneksi MetaMask dari app.js
        const isConnected = await initMetaMask();
        if (!isConnected) return;

        try {
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Menunggu Konfirmasi MetaMask...';
            btn.classList.add('disabled');

            alert("⏳ Meminta persetujuan MetaMask... Silakan cek ekstensi MetaMask kamu.");
            
            // Panggil fungsi requestBorrow pakai asetContract dari app.js
            const tx = await asetContract.requestBorrow(assetId, borrowerName);
            
            alert("🔄 Transaksi peminjaman sedang diproses di jaringan. Mohon tunggu sekitar 15-30 detik...");
            
            await tx.wait(); 
            
            // --- TRIGGER UPDATE DASHBOARD ---
            let txCount = parseInt(localStorage.getItem('totalTx')) || 28;
            localStorage.setItem('totalTx', txCount + 1);
            // --------------------------------
            
            alert("✅ Transaksi Berhasil! \nPengajuan peminjaman telah dicatat di Blockchain. Menunggu Approval Admin.");
            
            btn.innerHTML = originalText;
            btn.classList.remove('disabled');
            document.getElementById('borrowForm').reset();
            
        } catch (error) {
            console.error(error);
            btn.innerHTML = '🚀 Ajukan Pinjaman via MetaMask';
            btn.classList.remove('disabled');
            
            if(error.message && error.message.includes("Aset sedang tidak tersedia")) {
                alert("❌ Gagal: Aset ini sedang tidak tersedia atau belum didaftarkan oleh Admin.");
            } else {
                alert("❌ Gagal mengirim transaksi. Pastikan saldo ETH kamu cukup untuk bayar Gas Fee.");
            }
        }
    }
</script>

</body>
</html>
